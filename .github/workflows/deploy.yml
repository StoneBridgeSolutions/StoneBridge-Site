name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cp /root/stonebridge-marketing/dist/index.html /root/stonebridge-marketing/dist/index.html.bak
            cd /root/stonebridge-marketing
            git pull origin main
            pm2 restart stonebridge-marketing
            pm2 save
            echo "Deploy complete"
