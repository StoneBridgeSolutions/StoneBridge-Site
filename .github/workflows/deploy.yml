name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger deploy
        run: |
          PAYLOAD='{"ref":"main"}'
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_SECRET }}" | sed 's/.*= //')
          curl -f -X POST http://${{ secrets.SSH_HOST }}:4000/deploy/site \
            -H "Content-Type: application/json" \
            -H "x-hub-signature-256: sha256=$SIG" \
            -d "$PAYLOAD"
