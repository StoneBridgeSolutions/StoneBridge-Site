<!-- Public, link-only revision request page. No nav link anywhere --
     clients reach it only via their personal link:
     stonebridgesolutions.io/revisions?token=XXXX -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Revision — StoneBridge Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1526;--navy-2:#111b30;--gold:#d9b23d;--white:#f7f7f5;--grey:#c6cbd6}
*{box-sizing:border-box}body{background:var(--navy);color:var(--grey);font-family:'Poppins',sans-serif;font-weight:300;margin:0;padding:40px 20px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:'Playfair Display',serif;color:var(--white);font-size:1.8rem;margin-bottom:8px}
.status-box{background:var(--navy-2);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px;margin:24px 0;font-size:.95rem}
.status-box strong{color:var(--gold)}
label{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-top:18px}
textarea,input[type=file]{width:100%;background:var(--navy-2);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:var(--white);font-family:'Poppins',sans-serif;margin-top:6px}
textarea{min-height:110px}
button{margin-top:22px;width:100%;background:var(--gold);color:var(--navy);font-weight:600;border:0;border-radius:10px;padding:14px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:14px;font-size:.9rem}
#loading, #error, #form-area{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Request a Change</h1>
  <p>Tell us what you'd like updated on your site. We'll take it from there.</p>

  <div id="loading">Checking your account...</div>
  <div id="error" class="status-box"></div>

  <div id="form-area">
    <div class="status-box" id="statusBox"></div>
    <form id="revForm">
      <label>What would you like changed?
        <textarea name="description" required placeholder="Describe the change -- new text, a photo swap, a color tweak, etc."></textarea>
      </label>
      <label>New images (optional)
        <input type="file" name="images" accept="image/*" multiple>
      </label>
      <button type="submit" id="submitBtn">Submit Request</button>
      <p id="msg"></p>
    </form>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const API = 'https://api.stonebridgesolutions.io';

async function init() {
  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = "This link is missing information. Please use the link we sent you, or contact us directly.";
    return;
  }
  document.getElementById('loading').style.display = 'block';
  try {
    const res = await fetch(`${API}/revisions/status?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    if (!data.ok) throw new Error(data.error || 'Link not recognized.');

    const box = document.getElementById('statusBox');
    if (data.included_remaining > 0) {
      box.innerHTML = `<strong>${data.business_name}</strong> — you have <strong>${data.included_remaining}</strong> included revision${data.included_remaining === 1 ? '' : 's'} remaining. This request will be free.`;
    } else if (data.bundle_credits_available > 0) {
      box.innerHTML = `<strong>${data.business_name}</strong> — you have <strong>${data.bundle_credits_available}</strong> revision credit${data.bundle_credits_available === 1 ? '' : 's'} available from your bundle. This request will be free.`;
    } else {
      box.innerHTML = `<strong>${data.business_name}</strong> — you're out of included revisions. This request will be billed at <strong>${data.price_if_charged}</strong> (${data.care_plan_active ? 'Care Plan rate' : 'no active Care Plan'}). You'll be taken to secure checkout after submitting.`;
    }
    document.getElementById('form-area').style.display = 'block';
  } catch (err) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = err.message;
  }
}
init();

document.getElementById('revForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  try {
    const fd = new FormData(this);
    fd.append('token', token);
    const res = await fetch(`${API}/revisions/request`, { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Submission failed');
    if (data.charged && data.redirect_url) {
      msg.textContent = 'Taking you to checkout...';
      window.location.href = data.redirect_url;
    } else {
      this.hidden = true;
      msg.textContent = "Request received! We'll take care of it and follow up if we have questions.";
    }
  } catch (err) {
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Submit Request';
  }
});
</script>
</body>
</html>
